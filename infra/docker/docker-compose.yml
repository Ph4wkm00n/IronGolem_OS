version: "3.9"

# v0.1 deployment: gateway + web only.
#
# Scheduler, health, defense, tenancy, research, optimizer, and fleet have
# been parked under `services/_deferred/` per Step 7 of the v0.1 plan
# (Plans/create-a-plan-to-glowing-nest.md). They will rejoin this file in
# v0.2 once their behavior is wired into the gateway runtime client.

services:
  gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.services
    command: ["irongolem-gateway"]
    ports:
      - "8080:8080"
    environment:
      - IRONGOLEM_MODE=solo
      - IRONGOLEM_DB_PATH=/data/irongolem.db
      - IRONGOLEM_LOG_LEVEL=info
      - DEPLOYMENT_MODE=solo
      # HMAC bearer-token secret (Step 7). The compose-default value here is
      # a placeholder for local dev only; production deployments MUST inject
      # a high-entropy value through their secret manager.
      - IRONGOLEM_HMAC_SECRET=${IRONGOLEM_HMAC_SECRET:-dev-secret-do-not-use-in-prod}
    volumes:
      - irongolem-data:/data

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "3000:3000"
    depends_on:
      - gateway

volumes:
  irongolem-data:
