<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IronGolem — Memory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script>
    window.module = { exports: {} };
    window.exports = window.module.exports;
    window.require = function(name) {
      if (name === "react") return window.React;
      if (name === "react-dom") return window.ReactDOM;
      throw new Error("require not shimmed: " + name);
    };
  </script>
  <style>.bg-app { background: var(--bg-app); }</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="env,react,typescript" src="Memory.tsx"></script>
  <script type="text/babel">
    const Memory = window.Memory;
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<Memory />);
  </script>
</body>
</html>
