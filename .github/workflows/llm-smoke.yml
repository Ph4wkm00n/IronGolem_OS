# Real-LLM CI smoke (v0.2 Step 5 / Gate 6 of Plans/v0.2-foundation.md,
# extended in v0.3 Step 3 of Plans/modular-puzzling-blum.md).
#
# Validates both LLM providers end-to-end without breaking the default
# mock path that ci.yml runs. Manual-dispatch + nightly cron. A failure
# in either job is NOT a merge blocker — these are release-criterion
# gates for tagging v0.2.0 / v0.3.0 respectively.
#
# To enable:
#   - set ANTHROPIC_API_KEY  → unlocks the anthropic job
#   - set OPENAI_API_KEY     → unlocks the openai job
# Without a given secret, the matching job skips cleanly
# (exit 2 → workflow shows "skipped", not "failed").
name: LLM Smoke

on:
  # Trigger from the Actions tab.
  workflow_dispatch:

  # Nightly at 06:00 UTC. Estimated cost < $0.001/run on each provider.
  schedule:
    - cron: "0 6 * * *"

# Don't run on every push — this is an opt-in / time-based gate.
concurrency:
  group: llm-smoke
  cancel-in-progress: true

env:
  # Opt into Node.js 24 for JavaScript actions ahead of the 2026-06-02
  # GitHub Actions forced default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  smoke:
    name: ${{ matrix.provider }} provider smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: anthropic
            script: scripts/smoke-llm.sh
            model: claude-haiku-4-5-20251001
            api_key_env: ANTHROPIC_API_KEY
          - provider: openai
            script: scripts/smoke-llm-openai.sh
            model: gpt-4o-mini
            api_key_env: OPENAI_API_KEY
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-llm-smoke-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-llm-smoke-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: services/go.sum

      - name: Run smoke-llm (${{ matrix.provider }})
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IRONGOLEM_LLM_MODEL: ${{ matrix.model }}
        run: |
          set +e
          bash "${{ matrix.script }}"
          rc=$?
          # Exit 2 means "skipped, secret missing" — treat as success so the
          # workflow surfaces as green on forks / first runs without the key.
          if [ $rc -eq 2 ]; then
            echo "::notice::smoke-llm (${{ matrix.provider }}) skipped — ${{ matrix.api_key_env }} not configured"
            exit 0
          fi
          exit $rc
