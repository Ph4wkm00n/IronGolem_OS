name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt into Node.js 24 for JavaScript actions ahead of the 2026-06-02
  # GitHub Actions forced default. Without this, actions/setup-go@v5
  # and friends emit Node 20 deprecation warnings.
  # See https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  go-check:
    name: Go Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            services/go.sum
            connectors/go.sum

      - name: Vet services
        working-directory: services
        run: go vet ./...

      - name: Test services
        working-directory: services
        run: go test ./... -v -count=1

      - name: Build services
        working-directory: services
        run: go build ./...

      - name: Build connectors
        working-directory: connectors
        run: go build ./...

  typescript-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      # Package test scripts run `bun test` (repo convention).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # No `|| true` here: this job exists to fail when TypeScript breaks.
      # (The pre-v0.4 swallowing hid a workspace-wide broken lint setup and
      # type errors in packages/i18n for two releases.)
      #
      # Build runs FIRST: packages that consume workspace siblings via
      # project references (plugin-sdk -> schema) typecheck against the
      # sibling's dist output, which must exist.
      - name: Build packages
        run: |
          pnpm --filter @irongolem/design-tokens build
          pnpm --filter @irongolem/schema build
          pnpm --filter @irongolem/ui build
          pnpm --filter @irongolem/web build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test packages
        run: pnpm --filter @irongolem/design-tokens test

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Rust security audit
        run: cargo audit || true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            services/go.sum
            connectors/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Go vulnerability check (services)
        working-directory: services
        run: govulncheck ./... || true

      - name: Go vulnerability check (connectors)
        working-directory: connectors
        run: govulncheck ./... || true
